services:
  - type: web
    name: aliya-bot
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ACCOUNT_TXT
        sync: false
      - key: ACCOUNT2_TXT
        sync: false
      - key: ACCOUNT3_TXT
        sync: false
      - key: ACCOUNT4_TXT
        sync: false
      - key: ACCOUNT5_TXT
        sync: false
      - key: ALIYA_SELF_PING
        value: "1"
